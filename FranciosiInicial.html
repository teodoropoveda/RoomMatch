<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Franciosi Imóveis</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="device-canvas">
        <div class="window-card">
            
            <!-- Header -->
            <header class="app-header">
                <button class="back-button">
                    <i class="fa-solid fa-chevron-left"></i>
                    <span>VOLTAR</span>
                </button>

                <div class="logo-container">
                    <!-- Insira aqui o caminho do seu arquivo de imagem -->
                    <img src="F de franciosi 2.png" alt="Logo Franciosi" class="logo-img">
                </div>

                <div class="profile-avatar">
                    <i class="fa-solid fa-user"></i>
                </div>
            </header>

            <!-- Section Container do Banner -->
            <section class="banner-section">

                <!-- Box da Imagem (À direita) -->
                <div class="image-box">
                    <img src="franciosi2.jpg" alt="Fachada Franciosi Imóveis" class="hero-image">
                </div>

                <!-- Card de Texto Sobreposto (À esquerda) -->
                <div class="hero-card">
                    <p class="subtitle">TRADIÇÃO & CONFIANÇA</p>

                    <h1 class="title">
                        Franciosi,<br>
                        há mais de <span class="highlight">40 anos</span><br>
                        construindo histórias<br>
                        e deixando marcas.
                    </h1>

                    <p class="description">
                        Mais do que imóveis, ajudamos você a encontrar o lugar certo para o seu futuro.
                    </p>

                    <button class="cta-button">
                        Ver nossos imóveis
                    </button>
                </div>

            </section>

        </div>
    </div>

</body>
</html>
