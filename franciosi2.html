
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Franciosi Imóveis - Itapetininga</title>

    <link rel="stylesheet" href="style2.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <div class="page-container">
        
        <header class="hero-section">

            <img
                src="franciosi2.jpg"
                alt="Imagem de fundo da imobiliária"
                class="hero-bg-img"
            >

            <div class="hero-overlay"></div>

            <div class="hero-header">

                <a href="FranciosiInicial.html" class="back-button">
                    <i class="fa-solid fa-chevron-left"></i>
                    <span>VOLTAR</span>
                </a>

                <div class="logo-wrapper">
                    <img
                        src="FFranciosi sem fundo.png"
                        alt="Logo Franciosi"
                        class="logo-img"
                    >
                </div>

                <div class="contact-info">
                    Contato (015) 3275-9400
                </div>

            </div>

            <div class="hero-content">

                <h1 class="hero-title">
                    Sua imobiliária em<br>
                    Itapetininga
                </h1>

                <p class="hero-subtitle">
                    Apartamentos | Casas | Terrenos | Coberturas
                </p>

            </div>

        </header>

        <section class="properties-section">

            <h2 class="section-title">
                Conheça seu próximo imóvel!
            </h2>

            <div class="properties-grid">

                <div class="property-card">

                    <div class="card-image-box">
                        <img
                            src="grand oro 2.png"
                            alt="Grand Oro"
                            class="card-img"
                        >
                    </div>

                    <div class="card-info">
                        <h3 class="card-title">Grand Oro</h3>
                        <p class="card-location">
                            Vila Barth, Itapetininga
                        </p>
                    </div>

                </div>

                <div class="property-card">

                    <div class="card-image-box">
                        <img
                            src="evo by dkc.png"
                            alt="Evo by DKC"
                            class="card-img"
                        >
                    </div>

                    <div class="card-info">
                        <h3 class="card-title">Evo by DKC</h3>
                        <p class="card-location">
                            Centro - Itapetininga
                        </p>
                    </div>

                </div>

                <div class="property-card">

                    <div class="card-image-box">
                        <img
                            src="vila recreio 2.jpg"
                            alt="Vila Recreio"
                            class="card-img"
                        >
                    </div>

                    <div class="card-info">
                        <h3 class="card-title">Vila Recreio</h3>
                        <p class="card-location">
                            Vila Recreio - Itapetininga
                        </p>
                    </div>

                </div>

            </div>

        </section>

    </div>

</body>
</html>
